name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (real Directus 12 on SQLite; Directus 12.6 needs Node 26)
        if: matrix.node == 26
        run: npm run test:integration

  demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the demo image
        run: docker build -f demo/Dockerfile -t supertext-directus-demo .
      - name: Start the stand-in API
        run: node test/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check accounts and admin endpoints, translate as the editor
        env:
          PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: test/demo-check.sh
      - if: failure()
        run: docker logs demo 2>&1 | tail -100; cat stand-in.log
