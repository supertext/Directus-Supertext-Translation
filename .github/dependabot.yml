version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Versions we can't take yet or update by hand (see docs/DEVELOPER.md):
    ignore:
      - dependency-name: "typescript"  # TypeScript 7 is the native compiler; vue-tsc and the build tooling still need 5.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"  # types must match the oldest supported Node version, not the newest
        update-types: ["version-update:semver-major"]
      # vue must be exactly the version @directus/extensions-sdk pins (the one Directus bundles);
      # a second copy breaks vue-tsc. Update it by hand together with the SDK (see docs/DEVELOPER.md).
      - dependency-name: "vue"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/test/e2e"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    # New versions wait a week before Dependabot proposes them (time for a bad release to be pulled).
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  # Base images are pinned by digest (OpenSSF Scorecard: Pinned-Dependencies); this keeps the
  # digests and patch/minor tags current. Majors (a new Node, PHP, … line) are a decision, not an update.
  - package-ecosystem: "docker"
    directories:
      - "/demo"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
